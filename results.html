<!doctype html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takalam — Your results</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf8f2; --cream-2: #f3ecdc; --emerald: #31c48d; --emerald-dim: #28a878;
  --forest: #0d4f37; --ink: #1a2332; --ink-soft: #4b5563; --terracotta: #df8a5d; --gold: #e7ad44;
  --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--serif); font-weight: 540; margin: 0; }
.wrap { width: min(100% - 40px, 760px); margin-inline: auto; padding: 40px 0 80px; }
a.logo { display: inline-flex; align-items: center; gap: .5em; text-decoration: none; color: var(--ink); font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
.eyebrow { font-weight: 600; font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--terracotta); }
.card { background: #fff; border: 1.5px solid rgba(13,79,55,.14); border-radius: 20px; padding: 28px; margin-top: 22px; }
.band-headline { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-top: 10px; }
.pill { display: inline-block; background: var(--cream-2); color: var(--forest); font-weight: 600; font-size: .82rem; padding: .35em .9em; border-radius: 999px; margin-top: 8px; }
.diagnosis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
@media (max-width: 640px) { .diagnosis-grid { grid-template-columns: 1fr; } }
.diagnosis-grid .card { margin-top: 0; }
.diagnosis-grid h3 { font-size: 1.05rem; color: var(--forest); margin-bottom: 8px; }
.transcript-item { margin-top: 16px; }
.transcript-item p.prompt { font-weight: 600; font-size: .92rem; color: var(--ink-soft); margin-bottom: 6px; }
.transcript-item blockquote { margin: 0 0 10px; padding: 12px 16px; background: var(--cream-2); border-left: 3px solid var(--emerald); border-radius: 0 10px 10px 0; font-style: italic; }
audio { width: 100%; }
.reco-card { background: var(--forest); color: var(--cream); }
.reco-card h2 { color: var(--cream); }
.reco-price { font-family: var(--serif); font-size: 2.2rem; margin: 10px 0; }
.btn { display: inline-flex; align-items: center; gap: .6em; font-weight: 600; padding: .9em 1.6em; background: var(--emerald); color: #06281c; border: none; border-radius: 999px; cursor: pointer; text-decoration: none; font-size: 1rem; margin-top: 14px; }
.other-link { display: block; margin-top: 14px; font-size: .88rem; color: rgba(250,248,242,.7); }
.other-link a { color: var(--cream); }
#state-loading, #state-error { text-align: center; padding: 60px 0; color: var(--ink-soft); }
#state-error { display: none; }
#results { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/"><img src="/logo.svg" alt="" style="height:32px" onerror="this.style.display='none'"> Takalam</a>

  <div id="state-loading" data-i18n="results.loading">Loading your results...</div>
  <div id="state-error" data-i18n="results.error">We couldn't find these results. If you just finished the test, check your email for the link, or WhatsApp us.</div>

  <div id="results">
    <span class="eyebrow" id="studentEyebrow"></span>
    <h1 class="band-headline" id="headline"></h1>
    <span class="pill" id="bandPill"></span>

    <div class="diagnosis-grid">
      <div class="card">
        <h3 data-i18n="results.strength_label">What you're already good at</h3>
        <p id="strengthText"></p>
      </div>
      <div class="card">
        <h3 data-i18n="results.blocker_label">What's actually stopping you</h3>
        <p id="blockerText"></p>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="results.transcript_label">Your own words</h3>
      <div id="transcripts"></div>
    </div>

    <div class="card reco-card" id="recoCard">
      <span class="eyebrow" style="color:var(--gold)" data-i18n="results.recommendation_label">Our recommendation for you</span>
      <h2 id="recoName"></h2>
      <p id="recoBlurb"></p>
      <div class="reco-price" id="recoPrice"></div>
      <a class="btn" id="checkoutBtn" href="#" data-i18n="results.checkout_cta">Get started</a>
      <span class="other-link" id="otherLink"></span>
    </div>
  </div>
</div>

<script src="/assets/i18n.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var locale = /^\/en(\/|$)/.test(window.location.pathname) ? 'en' : 'fr';
  var loading = document.getElementById('state-loading');
  var errorEl = document.getElementById('state-error');
  var resultsEl = document.getElementById('results');

  function showError() {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
  }

  if (!id) { showError(); return; }

  fetch('/api/results/' + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(render)
    .catch(showError);

  function esc(s) {
    return String(s || '').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  }

  function render(data) {
    loading.style.display = 'none';
    resultsEl.style.display = 'block';

    document.getElementById('studentEyebrow').textContent = data.name || '';
    document.getElementById('headline').textContent = (data.diagnosis && data.diagnosis.headline) || data.finalBandLabel || '';
    document.getElementById('bandPill').textContent = data.finalBandLabel || '';
    document.getElementById('strengthText').textContent = (data.diagnosis && data.diagnosis.strength) || '';
    document.getElementById('blockerText').textContent = (data.diagnosis && data.diagnosis.blocker) || '';

    var transcripts = document.getElementById('transcripts');
    (data.answers || []).forEach(function (a) {
      if (!a.transcript) return;
      var div = document.createElement('div');
      div.className = 'transcript-item';
      div.innerHTML =
        '<p class="prompt">' + esc(a.promptText) + '</p>' +
        '<blockquote>' + esc(a.transcript) + '</blockquote>' +
        (a.audioUrl ? '<audio controls src="' + esc(a.audioUrl) + '"></audio>' : '');
      transcripts.appendChild(div);
    });

    var reco = data.recommendedProduct;
    var recoCard = document.getElementById('recoCard');
    if (reco) {
      document.getElementById('recoName').textContent = reco.name;
      document.getElementById('recoBlurb').textContent = reco.blurb;
      document.getElementById('recoPrice').textContent = reco.priceEur != null ? '€' + reco.priceEur : '';
      var checkoutBtn = document.getElementById('checkoutBtn');
      checkoutBtn.href = '#';
      checkoutBtn.addEventListener('click', function (e) {
        e.preventDefault();
        checkoutBtn.textContent = '...';
        fetch('/api/checkout?product=' + encodeURIComponent(reco.type) + '&attemptId=' + encodeURIComponent(id) + '&locale=' + locale)
          .then(function (r) { return r.json(); })
          .then(function (c) {
            if (c.url) { window.location.href = c.url; return; }
            throw new Error('No checkout URL in response');
          })
          .catch(function () {
            // /api/checkout itself degrades to a WhatsApp link on any
            // provider failure, so this only fires if the request never
            // reached it at all (e.g. offline) -- same honest fallback
            // either way, never a dead "..." button.
            var text = locale === 'en'
              ? "Hi Takalam! I'd like to book " + (reco.name || reco.type) + '.'
              : 'Bonjour Takalam ! Je voudrais réserver ' + (reco.name || reco.type) + '.';
            window.location.href = 'https://wa.me/212722774753?text=' + encodeURIComponent(text);
          });
      });

      var other = reco.type === 'speak' ? 'private' : 'speak';
      var otherLink = document.getElementById('otherLink');
      var otherText = (window.__takalamI18n && window.__takalamI18n['results.other_option']) || "Not sure? See the other option";
      otherLink.innerHTML = otherText + ': <a href="/#paths">' + (other === 'speak' ? 'Takalam Speak' : 'Takalam Private') + '</a>';
    } else {
      recoCard.style.display = 'none';
    }
  }
})();
</script>
</body></html>
